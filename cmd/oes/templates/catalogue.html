{{template "head" .}}
<h1>Catalogue</h1>
<p class="notice">Records here were generated by a language model from <a href="https://wger.de">wger</a> data and no person has checked them yet. Don't rely on them for safety.</p>
<form class="filters" id="filters">
<label>Search<input id="q" type="search" autocomplete="off" placeholder="Name or alias"></label>
<label>Movement<select id="pattern"><option value="">Any</option>{{range .Patterns}}<option value="{{.ID}}">{{.Label}}</option>{{end}}</select></label>
<label>Muscle<select id="muscle"><option value="">Any</option>{{range .Muscles}}<option value="{{.ID}}">{{.Label}}</option>{{end}}</select></label>
<label>Equipment<select id="equipment"><option value="">Any</option>{{range .Equipment}}<option value="{{.ID}}">{{.Label}}</option>{{end}}</select></label>
</form>
<p id="count" role="status" aria-live="polite">{{.Count}} exercises</p>
<ul class="list" id="results">{{range .Exercises}}<li data-id="{{.ID}}"><a href="/exercises/{{slug .ID}}/">{{.Name}}</a>{{if .Summary}}<span>{{.Summary}}</span>{{end}}</li>
{{end}}</ul>
<script src="/search.js" defer></script>
{{template "foot" .}}
