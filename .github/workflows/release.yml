# Publishes a release when a maintainer pushes a tag v<major>.<minor>.<patch>: checks the catalogue,
# and creates a GitHub release whose notes are the tag's CHANGELOG.md entry, with catalogue.json
# (every record in one file) attached. See CONTRIBUTING.md, Releasing.
name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./cmd/oes validate
      - run: go test ./...
      - run: go run ./cmd/oes site dist
      - name: The release notes, from the tag's CHANGELOG entry
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            /^## / { if (found) exit; if (index($0, "## " tag " ") == 1 || $0 == "## " tag) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no entry for ${GITHUB_REF_NAME}"; exit 1; fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/catalogue.json --title "${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
